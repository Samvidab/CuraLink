[project]
name = "curalink-backend"
version = "0.1.0"
description = "CuraLink API: healthcare administrative coordination prototype (demo mode only)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "icalendar>=6.0",
  "recurring-ical-events>=3.3",
  "reportlab>=4.2",
  "httpx>=0.27",
  "websockets>=12",
  "pillow>=10",
  "cryptography>=42",
  "anthropic>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
